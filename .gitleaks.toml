title = "pt_luyoa"

[extend]
useDefault = true

# Las variables de cada negocio (X-05) llevan sufijo: LUYOA_API_KEY_<NEGOCIO>, MCP_SERVICE_TOKEN_<NEGOCIO>.
# Valor asignado a una variable sensible: estilo .env (CLAVE=valor) o valor entre comillas
# ("CLAVE": "valor"). El código que solo nombra la variable (CLAVE: funcion) no coincide.
[[rules]]
id = "luyoa-or-openrouter-key-assignment"
description = "Llave asignada a una variable de entorno sensible"
regex = '''(?im)^\s*(?:export\s+)?(?:LUYOA_API_KEY\w*|OPENROUTER_API_KEY|APPROVAL_SECRET|MCP_SERVICE_TOKEN\w*|CRON_SECRET|DATABASE_AUTH_TOKEN|LANGFUSE_SECRET_KEY)\s*=\s*["']?[A-Za-z0-9_\-.\/+]{12,}|["']?(?:LUYOA_API_KEY\w*|OPENROUTER_API_KEY|APPROVAL_SECRET|MCP_SERVICE_TOKEN\w*|CRON_SECRET|DATABASE_AUTH_TOKEN|LANGFUSE_SECRET_KEY)["']?\s*[:=]\s*["'][A-Za-z0-9_\-.\/+]{12,}["']'''

[allowlist]
description = "La plantilla no tiene valores reales"
paths = ['''\.env\.example$''']
