title = "pt_luyoa"

[extend]
useDefault = true

[[rules]]
id = "luyoa-or-openrouter-key-assignment"
description = "Llave asignada a una variable de entorno sensible"
regex = '''(?i)(LUYOA_API_KEY|OPENROUTER_API_KEY|APPROVAL_SECRET|MCP_SERVICE_TOKEN|DATABASE_AUTH_TOKEN|LANGFUSE_SECRET_KEY)\s*[=:]\s*["']?[A-Za-z0-9_\-\.]{12,}'''

[allowlist]
description = "La plantilla no tiene valores reales"
paths = ['''\.env\.example$''']
