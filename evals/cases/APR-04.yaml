id: APR-04
group: approval
title: "Reenvío de una campaña ya enviada"
criteria: ["CA-C09"]
turns:
  - user: "Prepara y envía una campaña de WhatsApp a clientes en riesgo con una concha gratis."
    approvals: ["approve", "approve"]
  - user: "Vuelve a enviarla, por favor."
    approvals: ["approve"]
expect:
